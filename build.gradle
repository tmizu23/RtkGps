plugins {
    id 'com.android.application' version '8.13.0'
}

dependencies {
    implementation 'cz.msebera.android:httpclient:4.4.1.2'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-gcm:11.0.4'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.jakewharton:butterknife:10.2.3'
    implementation 'com.karumi:dexter:5.0.0'
    implementation 'ch.acra:acra:4.5.0'
    implementation 'commons-net:commons-net:3.6'
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'net.sf.proguard:proguard-annotations:6.2.2'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'org.osmdroid:osmdroid-android:6.1.2'
}

// USB / Bluetooth streams reach RTKLIB through a unix domain socket (STR_UNIXSVR),
// which upstream RTKLIB lacks; patch the submodule before the native build
def rtklibPatches = ['jni/RTKLIB-unixsocket.patch']
tasks.register('patchRtklib') {
    inputs.files(rtklibPatches)
    doLast {
        def rtklibDir = file('jni/RTKLIB')
        rtklibPatches.each { p ->
            def patch = file(p).absolutePath
            def applied = ['git', 'apply', '--reverse', '--check', patch].execute(null, rtklibDir).waitFor() == 0
            if (!applied) {
                def proc = ['git', 'apply', patch].execute(null, rtklibDir)
                def err = proc.err.text
                if (proc.waitFor() != 0) throw new GradleException("Failed to apply ${p}: ${err}")
                logger.lifecycle("Applied ${p} to jni/RTKLIB")
            }
        }
    }
}
preBuild.dependsOn patchRtklib

android {
    namespace 'gpsplus.rtkgps'
    compileSdk 35
    ndkVersion '27.1.12297006'
    // junit.framework.Assert is used in app code; it is no longer part of android.jar
    useLibrary 'android.test.base'

    lint {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    defaultConfig {
        applicationId "gpsplus.rtkgps"
        minSdk 21
        targetSdk 26
        multiDexEnabled true
        ndk {
            abiFilters.clear()
            //abiFilters.add('armeabi-v7a')
            //abiFilters.add('x86')
            //abiFilters.add('x86_64')
            abiFilters.add('arm64-v8a')
        }
    }
    packaging {
        jniLibs {
        //    pickFirsts += 'lib/armeabi-v7a/libc++_shared.so'
        //    pickFirsts += 'lib/armeabi-v7a/libproj.so'
        //    pickFirsts += 'lib/armeabi-v7a/librtkgps.so'
        //    pickFirsts += 'lib/armeabi-v7a/libntripcaster.so'
        //    pickFirsts += 'lib/armeabi-v7a/libgdalalljni.so'
        //    pickFirsts += 'lib/x86_64/libc++_shared.so'
        //    pickFirsts += 'lib/x86_64/libntripcaster.so'
        //    pickFirsts += 'lib/x86_64/librtkgps.so'
        //    pickFirsts += 'lib/x86_64/libproj.so'
        //    pickFirsts += 'lib/x86_64/libgdalalljni.so'
        //    pickFirsts += 'lib/x86/libc++_shared.so'
        //    pickFirsts += 'lib/x86/librtkgps.so'
        //    pickFirsts += 'lib/x86/libgdalalljni.so'
        //    pickFirsts += 'lib/x86/libntripcaster.so'
        //    pickFirsts += 'lib/x86/libproj.so'
            pickFirsts += 'lib/arm64-v8a/libc++_shared.so'
            pickFirsts += 'lib/arm64-v8a/libproj.so'
            pickFirsts += 'lib/arm64-v8a/librtkgps.so'
            pickFirsts += 'lib/arm64-v8a/libntripcaster.so'
            pickFirsts += 'lib/arm64-v8a/libgdalalljni.so'
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDir 'libs'
        }

           //    instrumentTest.setRoot('tests')
    }
    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
    // Release signing is read from keystore.properties (not in git) when present
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            jniDebuggable false

        }

    }
    productFlavors {
    }
}

